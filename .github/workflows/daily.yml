name: Atualiza curtailment

on:
  schedule:
    # ONS publica as 12h e 19h UTC; rodamos depois das duas.
    - cron: "40 13 * * *"
    - cron: "40 20 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Reprocessar todo o historico (demora ~30-60 min)"
        type: boolean
        default: false
      smoke:
        description: "So testar o acesso ao ONS e a CCEE (~40s) e sair"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: curtailment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Construir
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            python -m src.build --smoke
          elif [ "${{ inputs.full }}" = "true" ]; then
            python -m src.build --full
          else
            python -m src.build
          fi

      - name: Commitar dados e site
        if: inputs.smoke != true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data docs
          git diff --cached --quiet || git commit -m "dados: atualizacao $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
        if: inputs.smoke != true
      - uses: actions/upload-pages-artifact@v3
        if: inputs.smoke != true
        with:
          path: docs
      - id: deploy
        if: inputs.smoke != true
        uses: actions/deploy-pages@v4
